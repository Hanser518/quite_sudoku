plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.sudoku.quiet'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sudoku.quiet'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '1.10'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui:1.9.0'
    implementation 'androidx.compose.foundation:foundation:1.9.0'
    implementation 'androidx.compose.animation:animation:1.9.0'
    implementation 'androidx.compose.material3:material3:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    // Compose's transitive Espresso 3.5 uses an InputManager API removed on newer Android versions.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.9.0'
}

tasks.register('engineCheck') {
    dependsOn 'testDebugUnitTest'
}
